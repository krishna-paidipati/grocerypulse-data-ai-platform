[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "grocerypulse"
version = "0.1.0"
description = "A production-style grocery retail Data, ML and GenAI engineering platform."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

authors = [
    { name = "Vijay Krishna Paidipati" }
]

keywords = [
    "data-engineering",
    "machine-learning",
    "artificial-intelligence",
    "aws",
    "snowflake",
    "dbt",
    "kafka",
    "airflow",
    "pyspark",
    "retail"
]

dependencies = [
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "mypy>=2",
    "pip-audit>=2",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
]

docs = [
    "mkdocs-material>=9,<10",
    "mkdocstrings[python]",
]

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "--cov=grocerypulse",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]


[tool.coverage.run]
branch = true
source = ["grocerypulse"]


[tool.coverage.report]
show_missing = true
skip_covered = true


[tool.ruff]
target-version = "py312"
line-length = 100


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "D",
    "N",
    "ANN",
    "PT",
    "PTH",
    "DTZ",
    "S",
]

ignore = [
    "D203",
    "D213",
]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true


[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true
