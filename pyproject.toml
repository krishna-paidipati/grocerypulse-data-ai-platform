[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grocerypulse"
version = "0.1.0"
description = "A production-style grocery retail Data, ML and GenAI platform."
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100